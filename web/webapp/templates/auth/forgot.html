{% extends "base.html" %}
{% from "macros.html" import csrf %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1>Reset your password</h1>
    <p class="muted">Enter the e-mail you registered with. We will send you a link to set a new password.</p>
    <form method="post" class="form">
      {{ csrf() }}
      <div class="field"><label for="email">E-mail address</label><input type="email" id="email" name="email" required maxlength="120" autocomplete="email"></div>
      <button class="btn block" type="submit">Send reset link</button>
    </form>
    <p class="small mt-2 mb-0"><a href="{{ url_for('auth.login') }}">&larr; Back to sign in</a></p>
  </div>
</div>
{% endblock %}
