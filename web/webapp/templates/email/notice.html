{% extends "email/_layout.html" %}
{% block body %}
<h2 style="margin:0 0 12px;color:#14264a;font-size:20px">{{ heading }}</h2>
{% for line in lines %}<p style="margin:0 0 12px">{{ line }}</p>{% endfor %}
{% if button and url %}<p><a href="{{ url }}" style="display:inline-block;background:#2f5597;color:#ffffff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:bold">{{ button }}</a></p>{% endif %}
{% endblock %}
